name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db
          JWT_SECRET: ci-build-placeholder-secret-not-a-real-secret
          ENCRYPTION_KEY: ci-build-placeholder-secret-not-a-real-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
